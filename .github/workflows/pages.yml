name: Collect notices and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect fresh public notices before deploying
        type: boolean
        default: true
  schedule:
    # 06:17 Asia/Seoul; avoid the busiest minute of the hour.
    - cron: '17 21 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: policyfundfinder-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Restore last complete collection
        uses: actions/cache/restore@v4
        with:
          path: .catalog-cache
          key: catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-
      - name: Test static search and complete publication
        run: node --test --test-concurrency=1 tests/core.test.mjs tests/catalog.test.mjs tests/pages.test.mjs tests/sharing.test.mjs tests/classification.test.mjs tests/notice-text.test.mjs
      - name: Collect full catalog and active details
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh detail]'))
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          DETAIL_LIMIT: '1200'
          DETAIL_PRIORITY_IDS: ''
          PDF_LIMIT: '40'
        run: node scripts/collect-pages.mjs
      - name: Use last complete data on source-only deployments
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh detail]')) || (github.event_name == 'workflow_dispatch' && !inputs.refresh)
        run: |
          if [ -f .catalog-cache/data/manifest.json ]; then
            mkdir -p .work
            cp -R .catalog-cache/data .work/data
          fi
      - name: Build and verify all published files
        run: node scripts/build-pages.mjs
      - name: Preserve verified catalog for next collection
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh detail]'))
        uses: actions/cache/save@v4
        with:
          path: .catalog-cache
          key: catalog-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages is currently configured in branch/Jekyll mode as well as
      # running this custom workflow. The automatic branch deployment can
      # overwrite the verified _site after our job otherwise reports success.
      # Source: GitHub Actions in repository Pages settings is the permanent fix.
      - name: Wait for competing branch Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for attempt in $(seq 1 60); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "missing"' 2>/dev/null || echo "unknown")"
            if [ "$state" = "completed" ]; then
              echo "Legacy Pages build completed; publishing verified catalog last."
              exit 0
            fi
            if [ "$state" = "missing" ] || [ "$state" = "unknown" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 12 ]; then
                echo "No competing branch Pages run found; deploying verified catalog."
                exit 0
              fi
            else
              missing=0
            fi
            echo "Waiting for competing Pages run: $state ($attempt/60)"
            sleep 5
          done
          echo "::warning::Default Pages build exceeded five minutes. Switch Pages Source to GitHub Actions to prevent deployment races."
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
